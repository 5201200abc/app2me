<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <!-- Chrome dev 下可能不发 favicon 网络请求；内嵌小尺寸 App 图标，避免标签页回退到默认图标。-->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>mycode</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "mycode-theme";
        const DEFAULT_THEME = "mycode-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "mycode-dark") return "dark";
          if (theme === "mycode-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-mycode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-mycode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-mycode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--mycode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--mycode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-mycode-bootstrap-theme="light"] body {
        background: var(--mycode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--mycode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-mycode-browser-theme-surface],
      html[data-mycode-browser-theme-surface] body,
      html[data-mycode-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--mycode-bootstrap-bg, #161616)) !important;
      }

      html[data-mycode-browser-theme-surface="light"],
      html[data-mycode-browser-theme-surface="light"] body,
      html[data-mycode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--mycode-bootstrap-bg, #f8f8f8)) !important;
      }
    </style>
    <script type="module" src="./src/startup.ts"></script>
  </head>
  <body>
    <div id="root">
      <!-- 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。-->
      <div
        class="mycode-startup"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading mycode..."
      >
        <div class="mycode-startup__sky" aria-hidden="true"></div>
        <div class="mycode-startup__stars" aria-hidden="true"></div>
        <div class="mycode-startup__terrain" aria-hidden="true"></div>
        <div class="mycode-startup__halo" aria-hidden="true"></div>
        <div class="mycode-startup__emblem" aria-hidden="true"><img alt="" /></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mycode</title>
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.mycode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.mycode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }
    </style>
    <script type="module" src="./src/startup.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="mycode-startup"
      style="-webkit-app-region: drag"
      role="status"
      aria-busy="true"
      aria-label="Loading mycode..."
    >
      <div class="mycode-startup__sky" aria-hidden="true"></div>
      <div class="mycode-startup__stars" aria-hidden="true"></div>
      <div class="mycode-startup__terrain" aria-hidden="true"></div>
      <div class="mycode-startup__halo" aria-hidden="true"></div>
      <div class="mycode-startup__emblem" aria-hidden="true"><img alt="" /></div>
    </div>
    <script type="module">
      const loading = document.getElementById("loading");
      const finish = () => {
        // React 的 ready 事件是唯一完成信号，启动动画不能额外阻塞输入或靠超时伪造就绪。
        document.body.classList.add("mycode-startup-ready");
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) loading?.remove();
        else loading?.addEventListener("transitionend", () => loading.remove(), { once: true });
      };
      if (new URLSearchParams(location.search).get("windowKind") === "update-status") {
        loading?.remove();
        finish();
      } else window.addEventListener("mycode-react-startup-ready", finish, { once: true });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
